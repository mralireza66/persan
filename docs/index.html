<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cours de persan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap">
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#12303A;--mut:#5b6b70;--teal:#0B7A85;--gold:#E9A21A;--line:#e3ddd0}
@media(prefers-color-scheme:dark){:root{--bg:#10201f;--card:#172c2c;--ink:#eaf2f1;--mut:#9db4b3;--teal:#4cc3cd;--line:#284141}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:32px 16px 48px}
.fa{font-family:Vazirmatn,Tahoma,sans-serif}
h1{margin:0;font-size:2rem}h1 .fa{display:block;font-size:2.6rem;color:var(--teal);font-weight:800}
.sub{color:var(--mut);margin:6px 0 24px}
.go{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:24px;flex-wrap:wrap}
.go label{font-weight:700}.go input{width:84px;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer}
#msg{color:#c0392b;font-size:.9rem;flex-basis:100%}
h2{font-size:1.05rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:28px 0 10px}
a.s{display:flex;gap:14px;align-items:center;padding:14px;margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink)}
a.s:hover{border-color:var(--teal)}
.n{flex:none;width:42px;height:42px;border-radius:50%;background:var(--gold);color:#12303A;font-weight:800;display:grid;place-items:center}
.t b{display:block}.t span{color:var(--mut);font-size:.9rem}
.r .n{background:var(--teal);color:#fff;font-size:1.2rem}
footer{margin-top:32px;color:var(--mut);font-size:.85rem}
</style></head><body><div class="w">
<h1>Cours de persan<span class="fa" lang="fa" dir="rtl">آموزش زبان فارسی</span></h1>
<p class="sub">Leçons interactives d’après « Gâm-é avval » · Chaque page demande le code reçu de ton professeur.</p>
<div class="go"><label for="num">Numéro de séance</label><input id="num" type="number" min="1" max="7" inputmode="numeric"><button id="b">Ouvrir</button><span id="msg"></span></div>
<h2>Séances</h2><div id="L"></div>
<h2>Ressources</h2>
<a class="s r" href="alphabet-persan-hub.html"><span class="n fa" lang="fa">ب</span><span class="t"><b>Alphabet persan</b><span>Toutes les lettres, écriture et mots</span></span></a>
<a class="s r" href="conversation-persan.html"><span class="n fa" lang="fa">گ</span><span class="t"><b>Conversation du quotidien</b><span>Phrases utiles</span></span></a>
<footer>Préparé par Alireza Shakeraneh</footer></div>
<script>
const S=[["gam-e-avval-lecon1","Leçon 1","Dialogue et premières lettres"],["gam-e-avval-p19-26","Pages 19 à 26","Gâm-é avval"],["gam-e-avval-p27-30","Pages 27 à 30","Gâm-é avval"],["gam-e-avval-p31-38","Pages 31 à 38","Gâm-é avval"],["gam-e-avval-p39-42","Pages 39 à 42","Gâm-é avval"],["gam-e-avval-p43-50","Pages 43 à 50","Leçon 3"],["gam-e-avval-p51-54","Pages 51 à 54","Leçon 3"]];
document.getElementById('L').innerHTML=S.map((s,i)=>`<a class="s" href="${s[0]}.html"><span class="n">${i+1}</span><span class="t"><b>Séance ${i+1} · ${s[1]}</b><span>${s[2]}</span></span></a>`).join('');
function go(){const n=+document.getElementById('num').value;if(n>=1&&n<=S.length)location.href=S[n-1][0]+'.html';else document.getElementById('msg').textContent='Séance 1 à '+S.length+' seulement.'}
document.getElementById('b').onclick=go;document.getElementById('num').onkeydown=e=>{if(e.key==='Enter')go()};
</script></body></html>
